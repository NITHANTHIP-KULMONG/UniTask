name: unitask
description: A productivity app for university students.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  image_picker: ^1.1.2
  flutter_gen: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.3.0"

flutter:
  generate: true
  uses-material-design: true



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21


flutter_native_splash:
  color: "#0f172a"
  image: "assets/icon.png"
  android: true
  ios: true
  web: false
  android_12:
    image: "assets/icon.png"
    color: "#0f172a"